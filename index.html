<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monsterhöhle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE6F7; --ink:#2A2140; --soft:#6A5F86; --panel:#FFFFFF; --line:#D6CCEB;
  --accent:#6C3FC9; --accent-ink:#FFFFFF; --in:#2E9E5B; --out:#E0702F;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1630; --ink:#F1ECFF; --soft:#B3A8D1; --panel:#2A2245; --line:#40365F;
    --accent:#A98BFF; --accent-ink:#1C1630; --in:#5FD38D; --out:#FF9A5C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1630; --ink:#F1ECFF; --soft:#B3A8D1; --panel:#2A2245; --line:#40365F;
  --accent:#A98BFF; --accent-ink:#1C1630; --in:#5FD38D; --out:#FF9A5C;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.3}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 28px}
header{display:flex;align-items:center;gap:8px}
h1{font-size:1.7rem;margin:0;font-weight:800;flex:1}
.stars{font-size:1.3rem;font-weight:800;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.small{white-space:nowrap;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:2px 10px;font-weight:700;font-size:1rem}

/* Bühne */
.stage{position:relative;width:100%;aspect-ratio:16/11;border-radius:22px;overflow:hidden;
  background:#3B2F5C;margin-top:10px;user-select:none;-webkit-user-select:none}
.stage svg.bg{position:absolute;inset:0;width:100%;height:100%}
.stage .bg-fish{display:none}
.stage.fish .bg-fish{display:block}
.stage.fish .bg-monster{display:none}
.mon{position:absolute;width:11%;transform:translate(-50%,-100%);
  transition-property:left,top,opacity,transform;transition-timing-function:ease-in-out}
.mon svg{width:100%;height:auto;display:block}
.mon.flip svg{transform:scaleX(-1)}
.inner{transform-origin:50% 100%}
.mon.walk .inner{animation:bob .3s ease-in-out infinite alternate}
.mon.idle .inner{animation:bob 1.1s ease-in-out infinite alternate}
.mon.cheer .inner{animation:jump .45s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-7%) rotate(5deg)}}
@keyframes jump{from{transform:translateY(0) scale(1.04,.96)}to{transform:translateY(-28%) scale(.96,1.04)}}
.tail{transform-box:fill-box;transform-origin:100% 50%;animation:wag .45s ease-in-out infinite alternate}
@keyframes wag{from{transform:scaleY(1)}to{transform:scaleY(.7)}}
.weed{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.bub{transform-box:fill-box;animation:rise 5s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.8}100%{transform:translateY(-70px);opacity:0}}

.eyes{position:absolute;width:1.9%;aspect-ratio:1/1;transform:translate(-50%,-50%);opacity:0;
  transition:opacity .4s;z-index:3;pointer-events:none}
.eyes::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:#FFE66D;box-shadow:0 0 6px 2px rgba(255,230,109,.6)}
.eyes.ring::before{background:transparent;border:2px solid rgba(255,230,109,.8);box-shadow:none}
.eyes.on{opacity:1;animation:blink 3.2s infinite}
@keyframes blink{0%,90%,100%{transform:translate(-50%,-50%) scaleY(1)}94%{transform:translate(-50%,-50%) scaleY(.1)}}
.beam{position:absolute;left:67.5%;top:51%;width:25%;height:38%;
  border-radius:50% 50% 6% 6%/70% 70% 6% 6%;
  background:radial-gradient(ellipse at 50% 75%,rgba(255,240,170,.30),rgba(255,240,170,0) 72%);
  opacity:0;transition:opacity .4s;z-index:2;pointer-events:none}
.stage.lamp .beam{opacity:1}
.angler{position:absolute;left:71%;top:47%;width:10%;transform:translate(-50%,-50%);opacity:0;
  transition:opacity .5s;z-index:4;pointer-events:none;display:none}
.angler svg{width:100%;height:auto;display:block}
.angler .lure{filter:drop-shadow(0 0 4px #FFF3A0)}
.stage.fish .angler{display:block}
.stage.fish.lamp .angler{opacity:1}
.dark{position:absolute;inset:0;z-index:59;display:grid;place-items:center;background:#0A0618;color:#fff;
  font-weight:800;font-size:clamp(1.6rem,6vw,2.6rem);opacity:0;transition:opacity .8s;pointer-events:none}
.stage.fish .dark{background:#3B3320}
.stage.night .dark{opacity:.94}
.banner{position:absolute;left:50%;top:5%;transform:translate(-50%,-14px);opacity:0;
  background:rgba(255,255,255,.94);color:#2A2140;border-radius:18px;padding:0 22px;
  font-weight:800;font-size:clamp(2rem,8vw,3.4rem);transition:opacity .3s,transform .3s;z-index:60;white-space:nowrap}
.banner.show{opacity:1;transform:translate(-50%,0)}
.glabel{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.94);color:#2A2140;
  border-radius:12px;padding:0 12px;font-weight:800;font-size:clamp(1.2rem,4.5vw,1.9rem);z-index:55;
  animation:pop .3s ease-out;transition:opacity .3s;white-space:nowrap}
.glabel.q{outline:3px solid #6C3FC9}
@keyframes pop{from{opacity:0;transform:translate(-50%,-60%)}}
.stage.dancing .glabel{opacity:0}

/* Fehler-Tiere */
.bat,.puffer{position:absolute;left:-20%;top:20%;opacity:0;z-index:58;pointer-events:none;transform:translate(-50%,-50%)}
.bat{width:16%}.puffer{width:14%}
.bat svg,.puffer svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 3px rgba(255,255,255,.35))}
.bat .wing,.eye,.puffer .spikes{transform-box:fill-box}
.bat .wl{transform-origin:100% 60%}
.bat .wr{transform-origin:0% 60%}
.eye{transform-origin:center}
.puffer .spikes{transform-origin:center;opacity:0}
.bat.fly{animation:batfly 2.8s ease-in-out forwards}
.bat.fly .wing{animation:flap .17s ease-in-out infinite alternate}
.bat.fly .eye,.puffer.fly .eye{animation:stare 2.8s ease-in-out}
.puffer.fly{animation:pufffly 2.8s ease-in-out forwards}
.puffer.fly .spikes{animation:spikes 2.8s ease-in-out}
@keyframes batfly{
  0%{left:31%;top:22%;opacity:1;transform:translate(-50%,-50%) scale(.45)}
  15%{left:20%;top:13%;transform:translate(-50%,-50%) scale(.8)}
  40%{left:48%;top:36%;transform:translate(-50%,-50%) scale(1.3)}
  62%{left:52%;top:34%;transform:translate(-50%,-50%) scale(1.3)}
  85%{left:90%;top:14%;transform:translate(-50%,-50%) scale(.8)}
  100%{left:120%;top:24%;opacity:1;transform:translate(-50%,-50%) scale(.7)}
}
@keyframes pufffly{
  0%{left:-15%;top:38%;opacity:1;transform:translate(-50%,-50%) scale(.7)}
  34%{left:48%;top:38%;transform:translate(-50%,-50%) scale(.8)}
  44%{left:50%;top:36%;transform:translate(-50%,-50%) scale(1.9)}
  64%{left:50%;top:36%;transform:translate(-50%,-50%) scale(1.9)}
  74%{left:56%;top:38%;transform:translate(-50%,-50%) scale(.8)}
  100%{left:120%;top:34%;opacity:1;transform:translate(-50%,-50%) scale(.7)}
}
@keyframes spikes{0%,38%{opacity:0;transform:scale(.6)}46%,64%{opacity:1;transform:scale(1)}72%,100%{opacity:0;transform:scale(.6)}}
@keyframes flap{to{transform:scaleY(.3)}}
@keyframes stare{0%,36%{transform:scale(1)}45%,62%{transform:scale(1.55)}74%,100%{transform:scale(1)}}

/* Tanz */
.arm{transform-box:fill-box}
.al{transform-origin:85% 15%}
.ar{transform-origin:15% 15%}
.mon.dance .al,.mon.arms .al,.mon.hop .al{animation:wavel .35s ease-in-out infinite alternate}
.mon.dance .ar,.mon.arms .ar,.mon.hop .ar{animation:waver .35s ease-in-out infinite alternate}
@keyframes wavel{from{transform:rotate(10deg)}to{transform:rotate(130deg)}}
@keyframes waver{from{transform:rotate(-10deg)}to{transform:rotate(-130deg)}}
.mon.dance .inner{animation:dance 1.6s ease-in-out infinite}
@keyframes dance{
  0%,100%{transform:translateY(0) rotate(0) scale(1,1)}
  12%{transform:translateY(0) rotate(-14deg)}
  25%{transform:translateY(0) rotate(14deg)}
  37%{transform:translateY(-35%) rotate(0) scale(.95,1.05)}
  50%{transform:translateY(0) scale(1.1,.9)}
  62%{transform:translateY(-10%) scale(-1,1)}
  75%{transform:translateY(0) scale(-1,1) rotate(10deg)}
  87%{transform:translateY(-25%) scale(1,1)}
}
.mon.hop .inner{transform-origin:50% 55%;animation:hop .9s ease-in-out infinite}
@keyframes hop{
  0%,100%{transform:translateY(0) rotate(0) scale(1,1)}
  15%{transform:translateY(0) scale(1.15,.85)}
  45%{transform:translateY(-55%) rotate(180deg)}
  65%{transform:translateY(-55%) rotate(360deg)}
  85%{transform:translateY(0) rotate(360deg) scale(1.15,.85)}
}
.stage.party::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle at 20% 30%,rgba(255,80,180,.35),rgba(255,80,180,0) 35%),
    radial-gradient(circle at 70% 20%,rgba(80,200,255,.35),rgba(80,200,255,0) 35%),
    radial-gradient(circle at 45% 70%,rgba(255,230,90,.3),rgba(255,230,90,0) 35%);
  animation:disco 1.6s steps(1) infinite}
@keyframes disco{0%{filter:hue-rotate(0)}33%{filter:hue-rotate(120deg)}66%{filter:hue-rotate(240deg)}}
.fw{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

/* Text und Bedienung */
.say{font-size:1.35rem;font-weight:700;min-height:2.6em;margin:10px 4px 4px;max-width:36em}
.trail{display:flex;flex-wrap:wrap;gap:8px;min-height:2.2rem;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;font-weight:800;
  font-size:1.3rem;background:var(--panel);border:3px solid var(--line)}
.chip.in{border-color:var(--in)}
.chip.out{border-color:var(--out)}
.chip.now{border-color:var(--accent)}
[hidden]{display:none!important}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tool{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 14px;font-weight:700;font-size:1.1rem}
.tool[aria-pressed="true"]{background:#FFE66D;color:#2A2140;border-color:#E0C23E}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad button{background:var(--panel);border:2px solid var(--line);border-radius:16px;min-height:58px;
  font-size:1.8rem;font-weight:800}
.pad button:active{transform:scale(.96)}
.pad button:disabled{opacity:.3;text-decoration:line-through;cursor:default}
.hint{font-size:1.2rem;font-weight:700;color:var(--soft);min-height:1.6em;margin:10px 4px 0}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.world{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:10px 8px;font-weight:800;font-size:1.25rem}
.world[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.levels{display:grid;gap:10px}
.level{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);
  border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.level b{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-size:1.7rem}
.level span{display:block;font-size:1.3rem;font-weight:800}
.level small{display:block;font-size:1rem;color:var(--soft);font-weight:500}
.eq{font-size:clamp(2rem,9vw,3.2rem);font-weight:800;text-align:center;margin:4px 0 12px;white-space:nowrap}
.eq .p{color:var(--in)} .eq .m{color:var(--out)}
.eq .q{border:3px solid currentColor;border-radius:12px;padding:0 8px}
.streak{text-align:center;font-size:1.2rem;font-weight:700;color:var(--soft);margin:0 0 12px}
.streak b{color:var(--accent);letter-spacing:3px}
.primary{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:18px;
  padding:12px;font-size:1.5rem;font-weight:800}
.note{color:var(--soft);font-size:.95rem;margin-top:18px}
@media (prefers-reduced-motion: reduce){
  .stage.party::after{animation:none}
}
</style>
</head>

    <div class="bg-fish">

<script>
(function(){
const $=s=>document.querySelector(s);
const stage=$('#stage'), bannerEl=$('#banner'), sayEl=$('#say'), trailEl=$('#trail');
const CANCEL={cancel:true};
let token=0, inside=0, cave=[], goneItems=[], streak=0, lamp=false, task=null, phase='menu', wrong=0, lastKey='';

const store={
  get(k,d){try{const v=localStorage.getItem('mh-'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('mh-'+k,JSON.stringify(v))}catch(e){}}
};
let stars=store.get('stars',0), soundOn=store.get('sound',true), level=store.get('level',1), world=store.get('world','monster');
if(world!=='monster'&&world!=='fish')world='monster';
if(![1,2,3,4].includes(level))level=1;

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const wait=(ms,t)=>new Promise((res,rej)=>setTimeout(()=>t===token?res():rej(CANCEL),ms));

/* ---------- Vorlesen ---------- */
function speak(txt){
  if(!soundOn||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='de-DE';u.rate=.92;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('de'));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function say(txt,talk=true){sayEl.textContent=txt;if(talk)speak(txt)}
function updateSound(){$('#sound').textContent=soundOn?'🔊 Ton an':'🔇 Ton aus'}
function updateStars(){$('#stars').textContent='⭐ '+stars;$('#stars').setAttribute('aria-label',stars+' Sterne')}

/* ---------- Monster ---------- */
const COLORS=[['#9BE36B','#6FB848'],['#FF8F5A','#D9653A'],['#7FD6E8','#4FA9BE'],
              ['#E58AD9','#B85FAD'],['#FFD166','#D9A73D'],['#B79CFF','#8C6FE0']];
function monsterSVG(){
  const [c,d]=pick(COLORS), shape=rnd(0,2), top=rnd(0,2);
  let s='<svg viewBox="0 0 100 112" aria-hidden="true">';
  if(top===0) s+=`<path d="M28 36 L19 6 L42 28 Z" fill="${d}"/><path d="M72 36 L81 6 L58 28 Z" fill="${d}"/>`;
  if(top===1) s+=`<path d="M50 24 L50 8" stroke="${d}" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="7" r="6" fill="#FFE66D"/>`;
  if(shape!==1) s+=`<ellipse cx="34" cy="104" rx="12" ry="7" fill="${d}"/><ellipse cx="66" cy="104" rx="12" ry="7" fill="${d}"/>`;
  s+=`<g class="arm al"><ellipse cx="12" cy="66" rx="8" ry="14" fill="${d}" transform="rotate(20 12 66)"/></g><g class="arm ar"><ellipse cx="88" cy="66" rx="8" ry="14" fill="${d}" transform="rotate(-20 88 66)"/></g>`;
  if(shape===0) s+=`<path d="M22 102 C8 100 6 72 14 52 C22 28 38 20 50 20 C62 20 78 28 86 52 C94 72 92 100 78 102 Z" fill="${c}"/>`;
  if(shape===1) s+=`<path d="M22 108 L22 50 C22 28 36 18 50 18 C64 18 78 28 78 50 L78 108 L70 100 L62 108 L54 100 L46 108 L38 100 L30 108 Z" fill="${c}"/>`;
  if(shape===2) s+=`<circle cx="50" cy="62" r="38" fill="${c}"/>`;
  s+='<ellipse cx="50" cy="80" rx="19" ry="13" fill="#fff" opacity=".22"/>';
  s+='<circle cx="50" cy="46" r="13" fill="#fff"/><circle cx="52" cy="48" r="5.85" fill="#2A2140"/><circle cx="53.5" cy="46" r="1.95" fill="#fff"/>';
  s+='<path d="M33 65 Q50 71 67 65 Q50 84 33 65 Z" fill="#2A2140"/><path d="M38 67 L41 74 L44 68.5 Z M56 68.5 L59 74 L62 67 Z" fill="#fff"/>';
  return s+'</svg>';
}

/* ---------- Fische (schauen nach rechts, ein Auge) ---------- */
const FCOLORS=[['#FF8F5A','#D9653A'],['#FFD166','#D9A73D'],['#7FD6E8','#3F9FB8'],
               ['#E58AD9','#B85FAD'],['#9BE36B','#5FA83F'],['#FF6B7A','#C9414F']];
const FISH_SHAPES=[
  {cx:52,cy:66,rx:32,ry:22,dor:'M38 47 C44 30 60 30 68 47 Z',tail:'M24 66 L4 48 L9 66 L4 84 Z',ex:68,ey:60,er:8},
  {cx:54,cy:64,rx:26,ry:28,dor:'M40 40 C46 14 62 18 66 38 Z',tail:'M30 64 L8 46 L13 64 L8 82 Z',ex:68,ey:56,er:8},
  {cx:52,cy:68,rx:38,ry:16,dor:'M36 55 C44 42 60 42 70 55 Z',tail:'M16 68 L0 54 L4 68 L0 82 Z',ex:74,ey:64,er:7}];
function fishSVG(){
  const [c,d]=pick(FCOLORS), type=rnd(0,2), deco=rnd(0,2), fang=Math.random()<.35, B=FISH_SHAPES[type];
  const mx=B.cx+B.rx-3, my=B.cy+4;
  let s='<svg viewBox="0 0 100 112" aria-hidden="true">';
  s+=`<g class="tail"><path d="${B.tail}" fill="${d}"/></g>`;
  s+=`<path d="${B.dor}" fill="${d}"/>`;
  if(type===1) s+=`<path d="M44 88 C48 104 60 100 62 88 Z" fill="${d}"/>`;
  s+=`<ellipse cx="${B.cx}" cy="${B.cy}" rx="${B.rx}" ry="${B.ry}" fill="${c}"/>`;
  s+=`<ellipse cx="${B.cx}" cy="${B.cy+B.ry*.45}" rx="${B.rx*.7}" ry="${B.ry*.4}" fill="#fff" opacity=".22"/>`;
  if(deco===1)[B.cx-12,B.cx+2].forEach(x=>{s+=`<path d="M${x} ${B.cy-B.ry*.85} Q${x-5} ${B.cy} ${x} ${B.cy+B.ry*.85}" stroke="#fff" stroke-width="5" opacity=".5" fill="none" stroke-linecap="round"/>`});
  if(deco===2) s+=`<circle cx="${B.cx-14}" cy="${B.cy-4}" r="4" fill="${d}"/><circle cx="${B.cx-2}" cy="${B.cy+8}" r="3" fill="${d}"/><circle cx="${B.cx-22}" cy="${B.cy+7}" r="2.5" fill="${d}"/>`;
  s+=`<g class="arm ar"><ellipse cx="${B.cx-2}" cy="${B.cy+6}" rx="9" ry="5" fill="${d}" transform="rotate(25 ${B.cx-2} ${B.cy+6})"/></g>`;
  s+=`<circle cx="${B.ex}" cy="${B.ey}" r="${B.er}" fill="#fff"/><circle cx="${B.ex+2}" cy="${B.ey+1}" r="${B.er*.5}" fill="#2A2140"/><circle cx="${B.ex+3.2}" cy="${B.ey-1}" r="${B.er*.17}" fill="#fff"/>`;
  s+=`<path d="M${mx} ${my} q-4 4 -9 2" stroke="#2A2140" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(fang) s+=`<path d="M${mx-6} ${my+2.5} l1.5 4 l1.5 -3.6 Z" fill="#fff"/>`;
  return s+'</svg>';
}

/* ---------- Welten ---------- */
const THEMES={
  monster:{
    title:'Monsterhöhle', creature:monsterSVG, darkText:'Psst …',
    levels:['Monster kommen dazu','Monster kommen dazu oder laufen weg','Zweimal passiert etwas','Wie viele kamen dazu oder sind weg?'],
    start:n=>`${n} ${n===1?'Monster geht':'Monster gehen'} in die Höhle.`,
    plus:n=>`${n} ${n===1?'Monster kommt':'Monster kommen'} dazu und ${n===1?'geht':'gehen'} auch hinein.`,
    minus:n=>`${n} ${n===1?'Monster kommt':'Monster kommen'} wieder heraus und ${n===1?'läuft':'laufen'} weg.`,
    ask:'Wie viele Monster sind jetzt in der Höhle?',
    done:n=>`Super! Es sind ${n} Monster in der Höhle.`,
    darkPlus:'Oh, es ist dunkel geworden. Psst … im Dunkeln kommen noch Monster dazu.',
    darkMinus:'Oh, es ist dunkel geworden. Psst … im Dunkeln laufen einige Monster weg.',
    now:n=>`Es wird wieder hell. Jetzt sind ${n} Monster in der Höhle.`,
    qPlus:(a,n)=>`Vorher waren ${a} drin, jetzt sind es ${n}. Wie viele Monster sind dazugekommen?`,
    qMinus:(a,n)=>`Vorher waren ${a} drin, jetzt sind es nur noch ${n}. Wie viele Monster sind weggelaufen?`,
    doneUnknown:(plus,n)=>`Super! ${n===1?'Es ist 1 Monster':'Es sind '+n+' Monster'} ${plus?'dazugekommen':'weggelaufen'}.`,
    lampBtn:'🔦 Taschenlampe', lampSay:'Jedes leuchtende Auge ist ein Monster. Zähl die Augen!',
    menuSay:'Wie viele Monster sind in der Höhle? Wähle eine Stufe.',
    dance:'Monster-Tanz!', party2:'Tanz und Feuerwerk!',
    dance1Say:'Drei richtig hintereinander! Die Monster tanzen für dich!',
    dance2Say:'Fünf richtig hintereinander! Die Monster tanzen, und es gibt ein Feuerwerk!'
  },
  fish:{
    title:'Fischwrack', creature:fishSVG, darkText:'Blubb …',
    levels:['Fische kommen dazu','Fische kommen dazu oder schwimmen weg','Zweimal passiert etwas','Wie viele kamen dazu oder sind weg?'],
    start:n=>`${n} ${n===1?'Fisch schwimmt':'Fische schwimmen'} ins Wrack.`,
    plus:n=>`${n} ${n===1?'Fisch kommt':'Fische kommen'} dazu und ${n===1?'schwimmt':'schwimmen'} auch hinein.`,
    minus:n=>`${n} ${n===1?'Fisch kommt':'Fische kommen'} wieder heraus und ${n===1?'schwimmt':'schwimmen'} weg.`,
    ask:'Wie viele Fische sind jetzt im Wrack?',
    done:n=>`Super! Es sind ${n} Fische im Wrack.`,
    darkPlus:'Oh, eine Welle wirbelt Sand auf. Im trüben Wasser kommen noch Fische dazu.',
    darkMinus:'Oh, eine Welle wirbelt Sand auf. Im trüben Wasser schwimmen einige Fische weg.',
    now:n=>`Das Wasser wird wieder klar. Jetzt sind ${n} Fische im Wrack.`,
    qPlus:(a,n)=>`Vorher waren ${a} drin, jetzt sind es ${n}. Wie viele Fische sind dazugekommen?`,
    qMinus:(a,n)=>`Vorher waren ${a} drin, jetzt sind es nur noch ${n}. Wie viele Fische sind weggeschwommen?`,
    doneUnknown:(plus,n)=>`Super! ${n===1?'Es ist 1 Fisch':'Es sind '+n+' Fische'} ${plus?'dazugekommen':'weggeschwommen'}.`,
    lampBtn:'🐟 Laternenfisch', lampSay:'Der Laternenfisch leuchtet ins Wrack. Jedes Auge ist ein Fisch. Zähl die Augen!',
    menuSay:'Wie viele Fische sind im Wrack? Wähle eine Stufe.',
    dance:'Fisch-Tanz!', party2:'Tanz und Blasen-Feuerwerk!',
    dance1Say:'Drei richtig hintereinander! Die Fische tanzen für dich!',
    dance2Say:'Fünf richtig hintereinander! Die Fische tanzen, und es gibt ein Blasen-Feuerwerk!'
  }
};
let T=THEMES[world];

/* ---------- Figuren bewegen ---------- */
function spawn(x,y,svg){
  const e=document.createElement('div');
  e.className='mon';
  e._svg=svg||T.creature();
  e.innerHTML='<div class="inner">'+e._svg+'</div>';
  e.style.transitionDuration='0ms';
  e.style.left=x+'%';e.style.top=y+'%';e._x=x;e._y=y;
  e.style.zIndex=10+Math.round(y);
  stage.appendChild(e);return e;
}
function moveTo(e,x,y,ms){
  e.style.transitionDuration=ms+'ms';
  e.style.left=x+'%';e.style.top=y+'%';e._x=x;e._y=y;
  e.style.zIndex=10+Math.round(y);
}
const dist=(e,x,y)=>Math.hypot(e._x-x,e._y-y);
const CAVE=[80,88];

function slots(n){
  const rows=[];for(let i=0;i<n;i+=5)rows.push(Math.min(5,n-i));
  const Y={1:[84],2:[75,91],3:[70,81,92]}[rows.length];
  const res=[];
  rows.forEach((cnt,ri)=>{
    const span=(cnt-1)*10.5, start=31-span/2+(ri%2?4:0);
    for(let i=0;i<cnt;i++)res.push([start+i*10.5+(Math.random()*2-1),Y[ri]+(Math.random()*1.4-.7)]);
  });
  return res;
}

/* Aufstellung bei der Auflösung: jede Gruppe als eigener Block, mit Lücke dazwischen */
function groupLayout(sizes){
  const RY={1:[88],2:[80,93],3:[73,84,95]};
  for(const w of [11,10,9,8,7,6]){
    const step=w*.92, G=w*.8;
    for(const R of [1,2,3]){
      const cols=sizes.map(n=>Math.ceil(n/R));
      const total=cols.reduce((a,b)=>a+b,0)*step+(sizes.length-1)*G;
      if(total>92&&!(w===6&&R===3))continue;
      let x=50-total/2;const pos=[],labels=[];
      sizes.forEach((n,gi)=>{
        const c=cols[gi], rows=Math.ceil(n/c), pts=[];
        for(let i=0;i<n;i++)pts.push([x+step/2+(i%c)*step,RY[R][Math.floor(i/c)+(R-rows)]]);
        pos.push(pts);
        labels.push([x+c*step/2,RY[R][R-rows]-w*1.63-1.5]);
        x+=c*step+G;
      });
      return{w,pos,labels};
    }
  }
}

/* ---------- Augen im Versteck ---------- */
const EYE_POS=[[75,60],[80,59],[85,60],[71.5,68],[76.5,67.5],[81.5,68],[86.5,67.5],
  [71,76],[75.5,75.5],[80,76.5],[84.5,75.5],[89,76],[71,84],[75.5,84.5],[80,83.5],[84.5,84.5],[89,84]];
const eyeEls=EYE_POS.map(([x,y])=>{const e=document.createElement('div');e.className='eyes';
  e.style.left=x+'%';e.style.top=y+'%';e.style.animationDelay=(Math.random()*3).toFixed(2)+'s';
  stage.appendChild(e);return e;});
let eyeOrder=eyeEls.map((_,i)=>i);
/* Stufe 1, 2 und 4: Augen nach Gruppen getrennt wie in der Aufgabe. Stufe 3: verteilt.
   Bei „Knobeln“ mit Weglaufen stehen die Weggelaufenen als leere Kreise daneben. */
function eyeSpots(){
  if(level===3)return eyeOrder.slice(0,inside).map(i=>EYE_POS[i]);
  const groups=[];cave.forEach(it=>{(groups[it.g]=groups[it.g]||[]).push(it)});
  const sizes=groups.filter(Boolean).map(g=>[g.length,false]);
  if(task&&task.unknown&&goneItems.length)sizes.push([goneItems.length,true]);
  const RY=[85,79,73,67,61], dx=2.6, G=6;
  for(let R=1;R<=5;R++){
    const cols=sizes.map(([n])=>Math.ceil(n/R));
    const total=cols.reduce((a,c)=>a+(c-1)*dx,0)+(sizes.length-1)*G;
    if(total>18&&R<5)continue;
    let x=80-total/2;const pts=[];
    sizes.forEach(([n,ring],gi)=>{const c=cols[gi];
      for(let i=0;i<n;i++)pts.push([x+(i%c)*dx,RY[Math.floor(i/c)],ring]);
      x+=(c-1)*dx+G;});
    return pts;
  }
  return[];
}
function renderEyes(){
  eyeEls.forEach(e=>e.classList.remove('on','ring'));
  if(!lamp)return;
  eyeSpots().slice(0,eyeEls.length).forEach((p,i)=>{
    const e=eyeEls[i];e.style.left=p[0]+'%';e.style.top=p[1]+'%';
    e.classList.add('on');if(p[2])e.classList.add('ring');
  });
}
function setLamp(on){lamp=on;stage.classList.toggle('lamp',on);$('#lamp').setAttribute('aria-pressed',String(on));renderEyes()}
function lampText(){
  if(task&&task.unknown){
    return task.steps[0].plus
      ?'Links leuchten die, die schon drin waren. Rechts leuchten die neuen. Zähl die rechten Augen!'
      :'Die hellen Augen sind noch drin. Die leeren Kreise sind weg. Zähl die leeren Kreise!';
  }
  return T.lampSay;
}

/* ---------- Bewegungen ---------- */
async function groupIn(n,t){
  const pos=slots(n);
  const els=pos.map(([,y],i)=>spawn(-8-(i%5)*3,y));
  await wait(40,t);
  let maxD=0;
  els.forEach((e,i)=>{e.classList.add('walk');const d=700+pos[i][0]*22;maxD=Math.max(maxD,d);moveTo(e,pos[i][0],pos[i][1],d)});
  await wait(maxD+60,t);
  els.forEach(e=>e.classList.remove('walk'));
  return els;
}
async function enterCave(e,delay,t,g){
  await wait(delay,t);
  e.classList.remove('flip');e.classList.add('walk');
  const d=Math.round(300+dist(e,...CAVE)*20);
  moveTo(e,CAVE[0],CAVE[1],d);
  await wait(d,t);
  e.style.transitionDuration='400ms';e.style.opacity='0';e.style.transform='translate(-50%,-100%) scale(.55)';
  await wait(420,t);
  e.remove();cave.push({svg:e._svg,g});inside++;renderEyes();
}
const allIn=(els,t,g)=>Promise.all(els.map((e,i)=>enterCave(e,i*220,t,g)));
function spawnHidden(svg){const e=spawn(CAVE[0],CAVE[1],svg);e.style.opacity='0';e.style.transform='translate(-50%,-100%) scale(.55)';return e}
async function comeOut(e,delay,target,t,stay){
  await wait(delay,t);
  if(!stay){inside--;renderEyes();}
  e.style.transitionDuration='320ms';e.style.opacity='1';e.style.transform='translate(-50%,-100%)';
  await wait(330,t);
  e.classList.add('walk','flip');
  const d=Math.round(300+dist(e,...target)*20);
  moveTo(e,target[0],target[1],d);
  await wait(d,t);
  e.classList.remove('walk');
}
async function walkTo(e,delay,target,t){
  await wait(delay,t);
  e.classList.add('walk');
  const d=Math.round(400+dist(e,...target)*20);
  moveTo(e,target[0],target[1],d);
  await wait(d,t);
  e.classList.remove('walk');
}
async function exitCave(n,t){
  const pos=slots(n), items=cave.splice(cave.length-n,n).reverse(), els=items.map(it=>spawnHidden(it.svg));
  goneItems.push(...items);
  await wait(40,t);
  await Promise.all(els.map((e,i)=>comeOut(e,i*280,pos[i],t,false)));
  return els;
}
async function runAway(els,t){
  await Promise.all(els.map((e,i)=>(async()=>{
    await wait(i*90,t);
    e.classList.add('walk','flip');
    const d=Math.round(400+(e._x+14)*18);
    moveTo(e,-14,e._y,d);
    await wait(d,t);e.remove();
  })()));
}

/* ---------- Ablauf ---------- */
function clearStage(){
  stage.querySelectorAll('.mon,.glabel').forEach(e=>e.remove());
  stage.classList.remove('party','dancing','night');
  inside=0;cave=[];goneItems=[];renderEyes();hideBanner();
}
function banner(txt){bannerEl.textContent=txt;bannerEl.classList.add('show')}
function hideBanner(){bannerEl.classList.remove('show')}
function addChip(txt,kind){const c=document.createElement('span');c.className='chip '+kind;c.textContent=txt;trailEl.appendChild(c)}
function show(which){['menu','ask','done'].forEach(id=>{$('#'+id).hidden=(id!==which)})}

function gen(lv){
  for(let tries=0;tries<800;tries++){
    const a=rnd(1,10);
    if(lv===4){
      const plus=Math.random()<.5;let n;
      if(plus){if(a>14)continue;n=rnd(1,Math.min(9,15-a));if(a+n<3)continue}
      else{if(a<4)continue;n=rnd(1,Math.min(9,a-3))}
      const key='4|'+a+(plus?'+':'-')+n;
      if(key===lastKey)continue;
      lastKey=key;
      return{a,steps:[{plus,n}],result:plus?a+n:a-n,answer:n,unknown:true};
    }
    const k=lv===3?2:1, steps=[];let cur=a, ok=true;
    for(let i=0;i<k;i++){
      const plus=lv===1?true:Math.random()<.5;
      if(plus){if(15-cur<1){ok=false;break}const n=rnd(1,Math.min(9,15-cur));cur+=n;steps.push({plus,n})}
      else{if(cur<1){ok=false;break}const n=rnd(1,Math.min(9,cur));cur-=n;steps.push({plus,n})}
    }
    const key=a+'|'+steps.map(s=>(s.plus?'+':'-')+s.n).join('');
    if(ok&&cur>=3&&cur<=15&&key!==lastKey){lastKey=key;return{a,steps,result:cur,answer:cur,unknown:false}}
  }
  return{a:3,steps:[{plus:true,n:2}],result:5,answer:5,unknown:false};
}

async function playRound(){
  const t=++token;
  clearStage();setLamp(false);wrong=0;phase='show';show(null);
  trailEl.innerHTML='';$('#hint').textContent='';
  $('#pad').querySelectorAll('button').forEach(b=>b.disabled=false);
  eyeOrder.sort(()=>Math.random()-.5);
  try{
    say('Schau genau hin!');
    await wait(1300,t);
    banner(String(task.a));addChip(task.a+' rein','in');say(T.start(task.a));
    let els=await groupIn(task.a,t);
    await wait(500,t);
    await allIn(els,t,0);
    if(task.unknown){
      const st=task.steps[0];
      await wait(700,t);
      $('#dark').textContent=T.darkText;
      stage.classList.add('night');banner('?');
      addChip('? '+(st.plus?'rein':'raus'),st.plus?'in':'out');
      say(st.plus?T.darkPlus:T.darkMinus);
      await wait(2400,t);
      if(st.plus){els=await groupIn(st.n,t);await wait(300,t);await allIn(els,t,1)}
      else{els=await exitCave(st.n,t);await wait(300,t);await runAway(els,t)}
      await wait(400,t);
      stage.classList.remove('night');
      await wait(800,t);
      banner(String(task.result));addChip('jetzt '+task.result,'now');say(T.now(task.result));
      await wait(3000,t);
      hideBanner();
      phase='ask';show('ask');
      say(st.plus?T.qPlus(task.a,task.result):T.qMinus(task.a,task.result));
      return;
    }
    for(const [si,st] of task.steps.entries()){
      await wait(700,t);
      if(st.plus){
        banner('+'+st.n);addChip('+'+st.n+' rein','in');say(T.plus(st.n));
        els=await groupIn(st.n,t);await wait(500,t);await allIn(els,t,si+1);
      }else{
        banner('−'+st.n);addChip('−'+st.n+' raus','out');say(T.minus(st.n));
        els=await exitCave(st.n,t);await wait(700,t);await runAway(els,t);
      }
    }
    hideBanner();await wait(300,t);
    phase='ask';show('ask');say(T.ask);
  }catch(e){if(e!==CANCEL)console.error(e)}
}

function newTask(){task=gen(level);playRound()}

function eqHTML(){
  if(task.unknown){
    const st=task.steps[0];
    return `${task.a} <span class="${st.plus?'p':'m'}">${st.plus?'+':'−'} <span class="q">${st.n}</span></span> = ${task.result}`;
  }
  let s=String(task.a);
  task.steps.forEach(st=>{s+=st.plus?` <span class="p">+ ${st.n}</span>`:` <span class="m">− ${st.n}</span>`});
  return s+' = '+task.result;
}

async function success(){
  phase='done';const t=++token;
  stars++;store.set('stars',stars);updateStars();
  if(wrong===0)streak++;
  const party=streak>=5?2:streak===3?1:0, shown=Math.min(streak,5);
  $('#streak').innerHTML='Richtig hintereinander: <b>'+'●'.repeat(shown)+'○'.repeat(5-shown)+'</b>';
  if(streak>=5)streak=0;
  setLamp(false);inside=0;hideBanner();
  show('done');$('#eq').innerHTML=eqHTML();$('#hint').textContent='';
  let msg=task.unknown?T.doneUnknown(task.steps[0].plus,task.answer):T.done(task.result);
  if(stars%5===0)msg+=` Schon ${stars} Sterne!`;
  say(msg);
  try{
    const groups=[];cave.forEach(it=>{(groups[it.g]=groups[it.g]||[]).push(it)});
    const gl=groups.filter(Boolean).map(items=>({items,gone:false}));
    if(task.unknown&&!task.steps[0].plus&&goneItems.length)gl.push({items:goneItems.slice(),gone:true});
    const L=groupLayout(gl.map(g=>g.items.length));
    const els=[],pos=[],delays=[];let dl=0;
    gl.forEach((g,gi)=>{
      if(gi>0)dl+=600;
      g.items.forEach((it,i)=>{
        const target=L.pos[gi][i];let e;
        if(g.gone){e=spawn(-10,target[1],it.svg);e.style.opacity='.45';e._gone=true}
        else e=spawnHidden(it.svg);
        e.style.width=L.w+'%';els.push(e);pos.push(target);delays.push(dl);dl+=130;
      });
    });
    await wait(40,t);
    await Promise.all(els.map((e,i)=>(e._gone?walkTo(e,delays[i],pos[i],t):comeOut(e,delays[i],pos[i],t,true)).then(()=>{
      e.classList.remove('flip');
      e.querySelector('.inner').style.animationDelay=(Math.random()*.4).toFixed(2)+'s';
      e.classList.add('cheer');
    })));
    L.labels.forEach(([x,y],gi)=>{
      const g=gl[gi], d=document.createElement('div');d.className='glabel';
      d.textContent=g.gone?g.items.length+' weg':g.items.length;
      if(task.unknown&&(g.gone||(task.steps[0].plus&&gi===1)))d.classList.add('q');
      d.style.left=x+'%';d.style.top=y+'%';stage.appendChild(d);
    });
    if(party){
      await wait(900,t);
      danceAll(t);
      if(party===2){fireworks(t);banner(T.party2);speak(T.dance2Say)}
      else{banner(T.dance);speak(T.dance1Say)}
    }
  }catch(e){if(e!==CANCEL)console.error(e)}
}

function answer(v,btn){
  if(phase!=='ask')return;
  if(v===task.answer){success();return}
  wrong++;btn.disabled=true;errorFly();streak=0;
  const msg=`${v} stimmt nicht. Es sind ${task.answer>v?'mehr':'weniger'}.`;
  if(wrong>=2&&!lamp){
    setLamp(true);
    $('#hint').textContent=msg+' '+lampText();
    speak(msg+' '+lampText());
  }else{
    $('#hint').textContent=msg+' Versuch es nochmal!';
    speak(msg+' Versuch es nochmal!');
  }
}

function goMenu(){
  ++token;phase='menu';clearStage();setLamp(false);trailEl.innerHTML='';show('menu');
  slots(3).forEach(([x,y],i)=>{const e=spawn(x,y);e.classList.add('idle');e.querySelector('.inner').style.animationDelay=(i*.3)+'s'});
  say(T.menuSay,false);
}

function setWorld(w){
  world=w;T=THEMES[w];store.set('world',w);
  stage.classList.toggle('fish',w==='fish');
  $('#title').textContent=T.title;document.title=T.title;
  $('#lamp').textContent=T.lampBtn;
  document.querySelectorAll('.world').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.world===w)));
  document.querySelectorAll('.level').forEach((b,i)=>{b.querySelector('small').textContent=T.levels[i]});
}

/* ---------- Belohnungen ---------- */
/* Tanz in drei Teilen, läuft im Kreis weiter bis zur nächsten Aufgabe:
   1. Am Platz wackeln und winken  2. Kreistanz  3. Zurück an den Platz, dann Salto-Welle */
async function danceAll(t){
  stage.classList.add('party');
  const mons=[...stage.querySelectorAll('.mon')];
  const base=mons.map(e=>[e._x,e._y]);
  const delays=s=>mons.forEach((e,i)=>{e.querySelector('.inner').style.animationDelay=(i*s).toFixed(2)+'s'});
  mons.forEach(e=>e.classList.remove('cheer','flip'));
  try{
    for(;;){
      delays(.09);mons.forEach(e=>e.classList.add('dance'));
      await wait(3200,t);
      mons.forEach(e=>{e.classList.remove('dance');e.classList.add('walk','arms')});
      stage.classList.add('dancing');
      const n=mons.length, cx=50, cy=83, rx=Math.min(34,10+n*2.2), ry=8;
      for(let s=0;s<16;s++){
        const d=s===0?700:420;
        mons.forEach((e,i)=>{const a=i/n*Math.PI*2+s*.45, x=cx+Math.cos(a)*rx, y=cy+Math.sin(a)*ry;
          e.classList.toggle('flip',x<e._x);moveTo(e,x,y,d)});
        await wait(d,t);
      }
      mons.forEach((e,i)=>{e.classList.remove('flip');moveTo(e,base[i][0],base[i][1],700)});
      await wait(720,t);
      mons.forEach(e=>e.classList.remove('walk','arms'));
      stage.classList.remove('dancing');
      delays(.12);mons.forEach(e=>e.classList.add('hop'));
      await wait(2700,t);
      mons.forEach(e=>e.classList.remove('hop'));
    }
  }catch(e){if(e!==CANCEL)console.error(e)}
}
const fw=$('#fw'), fx=fw.getContext('2d');
const FW_COL=['#FF5FA2','#FFD166','#7FD6E8','#9BE36B','#B79CFF','#FF8F5A'];
function fireworks(t){
  const r=stage.getBoundingClientRect(), dpr=window.devicePixelRatio||1, W=r.width, H=r.height, u=W/300;
  fw.width=Math.round(W*dpr);fw.height=Math.round(H*dpr);fx.setTransform(dpr,0,0,dpr,0,0);
  const start=performance.now();let last=0;
  const parts=[];
  const dot=(x,y,rad,c,a)=>{fx.globalAlpha=a;fx.fillStyle=c;fx.beginPath();fx.arc(x,y,rad,0,7);fx.fill()};
  if(world==='fish'){
    const bubs=[];
    (function frame(now){
      if(t!==token){fx.clearRect(0,0,W,H);return}
      const el=now-start;
      if(el<6000&&now-last>150){bubs.push({x:W*(.05+Math.random()*.9),y:H+20,r:(3+Math.random()*9)*u,
        vy:-(1.2+Math.random()*1.8)*u,ph:Math.random()*6,c:pick(FW_COL),ty:H*(.06+Math.random()*.45)});last=now}
      fx.clearRect(0,0,W,H);
      for(let i=bubs.length-1;i>=0;i--){const b=bubs[i];b.y+=b.vy;b.ph+=.08;const x=b.x+Math.sin(b.ph)*3*u;
        fx.globalAlpha=.9;fx.lineWidth=Math.max(1.5,u*.9);fx.strokeStyle=b.c;fx.fillStyle='rgba(255,255,255,.15)';
        fx.beginPath();fx.arc(x,b.y,b.r,0,7);fx.fill();fx.stroke();
        dot(x-b.r*.35,b.y-b.r*.35,b.r*.22,'#FFFFFF',.8);
        if(b.y<=b.ty){for(let k=0;k<10;k++){const a=k/10*Math.PI*2,s=(.8+Math.random())*u*(b.r/(6*u));
          parts.push({x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:b.c})}bubs.splice(i,1)}}
      for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life-=.045;
        if(p.life<=0){parts.splice(i,1);continue}dot(p.x,p.y,1+u*.8,p.c,p.life)}
      fx.globalAlpha=1;
      if(el<6000||bubs.length||parts.length)requestAnimationFrame(frame);else fx.clearRect(0,0,W,H);
    })(start);
    return;
  }
  const rockets=[];
  const launch=()=>rockets.push({x:W*(.12+Math.random()*.76),y:H,vx:(Math.random()-.5)*u*.6,
    vy:-(H*.018+Math.random()*H*.005),ty:H*(.1+Math.random()*.3),c:pick(FW_COL)});
  const burst=(x,y,c)=>{for(let i=0;i<44;i++){const a=i/44*Math.PI*2, s=(1+Math.random()*1.4)*u;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:Math.random()<.2?'#FFFFFF':c})}};
  (function frame(now){
    if(t!==token){fx.clearRect(0,0,W,H);return}
    const el=now-start;
    if(el<6000&&now-last>450){launch();if(Math.random()<.4)launch();last=now}
    fx.clearRect(0,0,W,H);
    for(let i=rockets.length-1;i>=0;i--){const k=rockets[i];k.x+=k.vx;k.y+=k.vy;k.vy+=H*.0002;
      dot(k.x,k.y,2,k.c,1);
      if(k.y<=k.ty||k.vy>=0){burst(k.x,k.y,k.c);rockets.splice(i,1)}}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.035*u;p.vx*=.985;p.vy*=.985;p.life-=.012;
      if(p.life<=0){parts.splice(i,1);continue}dot(p.x,p.y,1+u*1.1,p.c,p.life)}
    fx.globalAlpha=1;
    if(el<6000||rockets.length||parts.length)requestAnimationFrame(frame);else fx.clearRect(0,0,W,H);
  })(start);
}

/* ---------- Fehler: Fledermaus oder Kugelfisch ---------- */
const bat=$('#bat'), puffer=$('#puffer');
(function(){let s='';for(let a=0;a<360;a+=30){const r=a*Math.PI/180;
  s+=`<line x1="${62+Math.cos(r)*27}" y1="${50+Math.sin(r)*27}" x2="${62+Math.cos(r)*40}" y2="${50+Math.sin(r)*40}"/>`}
  $('#spikes').innerHTML=s;})();
function errorFly(){
  const el=world==='fish'?puffer:bat;
  el.classList.remove('fly');void el.offsetWidth;el.classList.add('fly');
  if(el===bat){const s=document.getElementById('batStatic');if(s)s.style.opacity='0'}
}
bat.addEventListener('animationend',e=>{
  if(e.animationName==='batfly'){bat.classList.remove('fly');const s=document.getElementById('batStatic');if(s)s.style.opacity='1'}
});
puffer.addEventListener('animationend',e=>{if(e.animationName==='pufffly')puffer.classList.remove('fly')});

/* ---------- Aufbau ---------- */
const pad=$('#pad');
for(let i=1;i<=20;i++){
  const b=document.createElement('button');b.type='button';b.textContent=i;
  b.addEventListener('click',()=>answer(i,b));pad.appendChild(b);
}
document.querySelectorAll('.world').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.world===world)return;setWorld(b.dataset.world);goMenu();
}));
document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>{
  level=Number(b.dataset.level);store.set('level',level);newTask();
}));
$('#replay').addEventListener('click',()=>{if(task)playRound()});
$('#lamp').addEventListener('click',()=>{
  if(phase!=='ask')return;setLamp(!lamp);
  if(lamp){speak(lampText());$('#hint').textContent=lampText()}
});
$('#next').addEventListener('click',newTask);
$('#home').addEventListener('click',goMenu);
$('#sound').addEventListener('click',()=>{
  soundOn=!soundOn;store.set('sound',soundOn);updateSound();
  if(!soundOn){try{speechSynthesis.cancel()}catch(e){}}else speak('Ton an.');
});
updateSound();updateStars();setWorld(world);goMenu();
})();
